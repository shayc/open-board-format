version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    groups:
      types:
        patterns: ["@types/*"]
      oxc:
        patterns: ["oxfmt", "oxlint", "oxlint-tsgolint", "typescript"]
      dev-deps:
        dependency-type: development
        update-types: ["minor", "patch"]
        exclude-patterns: ["oxfmt", "oxlint", "oxlint-tsgolint", "typescript"]
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
