name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node: ["22", "24", "26"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: "npm"
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm run test:coverage
      - run: npm run build

  changeset:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Require a changeset when src/ changes
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          range="origin/$BASE_REF...HEAD"

          src_changes="$(git diff --name-only "$range" -- src/)"
          if [[ -z "$src_changes" ]]; then
            exit 0
          fi

          changeset_additions="$(
            git diff --name-only --diff-filter=A "$range" -- \
              ':(glob).changeset/*.md' \
              ':(exclude).changeset/README.md'
          )"

          if [[ -z "$changeset_additions" ]]; then
            echo "::error::This PR changes src/ but adds no changeset. Run 'npm run changeset' to record a patch/minor/major bump."
            exit 1
          fi
